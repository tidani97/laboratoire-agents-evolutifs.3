

name: CDI-TRADER V2 - Integration Tests

on:

  push:

    branches:

      - main

    paths:

      - "corrections/**"

      - "optimization/**"

      - "tests/**"

      - ".github/workflows/cdi-v2-tests.yml"

  pull_request:

    branches:

      - main

  workflow_dispatch:

permissions:

  contents: read

jobs:

  cdi-v2-tests:

    name: Governance and Optimization Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

      - name: Run integration tests

        run: |

          python -m unittest discover -s tests -v