name: Telegram Notifier Test

on:

  workflow_dispatch:

jobs:

  telegram-test:

    runs-on: ubuntu-latest

    steps:

      - name: Recuperer le depot

        uses: actions/checkout@v4

      - name: Configurer Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"

      - name: Tester le module Telegram

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          python -c "from integrations.telegram_notifier import send_telegram_message; result = send_telegram_message('Premier test de connexion CDI-TRADER. Notifications uniquement, aucun ordre de trading.'); print('Notification envoyee' if result else 'Echec de notification'); exit(0 if result else 1)"